name: Build and Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.14.0/typst-x86_64-unknown-linux-musl.tar.xz -o typst.tar.xz
          tar -xf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          typst --version
      
      - name: Install fonts
        run: |
          # Install Chinese fonts for proper rendering
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          # Install LXGW WenKai font
          mkdir -p ~/.local/share/fonts
          curl -fsSL https://github.com/lxgw/LxgwWenKai/releases/download/v1.330/LXGWWenKai-Regular.ttf -o ~/.local/share/fonts/LXGWWenKai-Regular.ttf || true
          fc-cache -f -v || true
      
      - name: Extract version from index.typ
        id: version
        run: |
          VERSION=$(grep -oP '#let VERSION = "\K[^"]+' index.typ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version extracted: $VERSION"
      
      - name: Build PDFs
        run: |
          # Build PDF without answers
          typst compile index.typ "高等数学习题册上册.pdf"
          
          # Build PDF with answers
          typst compile --input SHOW_ANSWER=true index.typ "高等数学习题册上册_带答案.pdf"
          
          # Verify files were created
          ls -lh *.pdf
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
      
      - name: Export HTML
        run: |
          # Export both versions (without and with answers)
          python3 scripts/export_html.py --both
          
          # Verify HTML files were created
          echo "Files in index/:"
          find index -type f -name "*.html" | head -10
          echo "Files in index_ans/:"
          find index_ans -type f -name "*.html" | head -10
      
      - name: Prepare deployment directory
        run: |
          # Create deployment directory
          mkdir -p deploy
          
          # Copy web folder contents to deploy
          cp -r web/* deploy/
          
          # Copy exported HTML directories
          cp -r index deploy/
          cp -r index_ans deploy/
          
          # Copy PDFs
          cp "高等数学习题册上册.pdf" deploy/
          cp "高等数学习题册上册_带答案.pdf" deploy/
          
          # Update version in index.html
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/<span class=\"version-value\" id=\"version\">v[0-9.]*</<span class=\"version-value\" id=\"version\">$VERSION</g" deploy/index.html
          
          # Verify the structure
          echo "Deploy directory structure:"
          ls -la deploy/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 高等数学习题册（上册）${{ steps.version.outputs.version }}
            
            自动构建和发布
            
            ### 下载
            - 📖 高等数学习题册上册.pdf (无答案版)
            - 📖 高等数学习题册上册_带答案.pdf (带答案版)
            
            ### 在线预览
            访问：https://dtce.xihale.top 或 GitHub Pages
          files: |
            高等数学习题册上册.pdf
            高等数学习题册上册_带答案.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
