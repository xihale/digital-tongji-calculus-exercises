<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高等数学习题册</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.6; color: #333; background: #f5f5f5; padding: 2rem;
      }
      .container {
        max-width: 720px; margin: 0 auto; background: #fff;
        padding: 3rem; border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #0066cc; }
      .intro { color: #666; margin-bottom: 1.5rem; font-size: 1.05rem; }
      .version {
        display: inline-block; background: #eef4ff; color: #0066cc;
        padding: 0.25rem 0.75rem; border-radius: 999px;
        font-size: 0.9rem; font-weight: 600; margin-bottom: 2rem;
      }
      .links { display: flex; flex-direction: column; gap: 0.75rem; margin: 1.5rem 0 2rem; }
      .links a {
        display: block; padding: 0.9rem 1.5rem; background: #0066cc;
        color: #fff; text-decoration: none; border-radius: 6px;
        font-size: 1.05rem; transition: background 0.2s;
      }
      .links a:hover { background: #0052a3; }
      .links a .desc { display: block; font-size: 0.85rem; opacity: 0.85; margin-top: 0.15rem; }
      footer {
        margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #eee;
        color: #888; font-size: 0.9rem; text-align: center;
      }
      footer a { color: #0066cc; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
      @media (max-width: 600px) {
        body { padding: 1rem; }
        .container { padding: 1.5rem; }
        h1 { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>高等数学习题册</h1>
      <p class="intro">
        开源习题集电子版，Typst 排版，配套同济大学《高等数学（第七版）》。
        答案解析由 AI 辅助生成，仅供参考。
      </p>
      <span class="version">{{VERSION}}</span>

      <div class="links">
        <a href="latest/practice.pdf">
          练习版（纯题）
          <span class="desc">仅题干，用于自测</span>
        </a>
        <a href="latest/full.pdf">
          附答案（题 + 详解）
          <span class="desc">题干与蓝色详解并列</span>
        </a>
        <a href="latest/answers.pdf">
          纯答案（速查 + 详解）
          <span class="desc">无题干，答案速查与详解</span>
        </a>
      </div>

      <footer>
        <p>
          历史版本与源码见
          <a href="https://github.com/xihale/tongji-calculus/releases">GitHub Releases</a> ·
          <a href="https://github.com/xihale/tongji-calculus">仓库主页</a>
        </p>
      </footer>
    </div>
  </body>
</html>
