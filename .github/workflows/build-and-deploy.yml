name: Build and Deploy (Manual)

on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: "是否自动进行版本 bump"
                required: false
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Typst
              run: |
                  curl -fsSL https://github.com/typst/typst/releases/download/v0.14.0/typst-x86_64-unknown-linux-musl.tar.xz -o typst.tar.xz
                  tar -xf typst.tar.xz
                  sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
                  typst --version

            - name: Auto-increment version
              id: auto_version
              if: github.event.inputs.version_bump == 'true'
              run: |
                  # Configure git
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Extract current version from index.typ
                  CURRENT_VERSION=$(grep -oP '#let VERSION = "\K[^"+' index.typ)
                  echo "Current version: $CURRENT_VERSION"

                  # Parse version (e.g., v0.0.3 -> 0.0.3)
                  VERSION_NUM=$(echo "$CURRENT_VERSION" | sed 's/^v//')

                  # Split version into parts and increment patch
                  MAJOR=$(echo "$VERSION_NUM" | cut -d. -f1)
                  MINOR=$(echo "$VERSION_NUM" | cut -d. -f2)
                  PATCH=$(echo "$VERSION_NUM" | cut -d. -f3)
                  PATCH=$((PATCH + 1))

                  NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
                  echo "New version: $NEW_VERSION"

                  # Update version in index.typ
                  sed -i "s/#let VERSION = \"$CURRENT_VERSION\"/#let VERSION = \"$NEW_VERSION\"/" index.typ

                  # Commit and push the version change
                  git add index.typ
                  git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
                  git push origin master
                  
                  echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

            - name: Set final version
              id: version
              run: |
                  # Get version from previous step or from file
                  VERSION="${{ steps.auto_version.outputs.version }}"
                  if [ -z "$VERSION" ]; then
                    VERSION=$(grep -oP '#let VERSION = "\K[^"+' index.typ)
                  fi
                  echo "Final version: $VERSION"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Build PDFs
              run: |
                  # Build PDF without answers
                  typst compile --font-path fonts/ --no-pdf-tags index.typ dtce.pdf

                  # Build PDF with answers
                  typst compile --font-path fonts/ --no-pdf-tags --input SHOW_ANSWER=true index.typ dtce_ans.pdf

                  # Verify files were created
                  ls -lh *.pdf

            - name: Prepare deployment directory
              run: |
                  # Create deployment directory
                  mkdir -p deploy

                  # Copy web folder contents to deploy
                  cp -r web/* deploy/

                  # Copy PDFs
                  cp dtce.pdf deploy/高等数学习题册上册.pdf
                  cp dtce_ans.pdf deploy/高等数学习题册上册_带答案.pdf

                  # Update version in index.html (already dynamic, but good for local/legacy)
                  VERSION="${{ steps.version.outputs.version }}"
                  sed -i "s/<span class=\"version-value\" id=\"version\">v[0-9.]*</<span class=\"version-value\" id=\"version\">$VERSION</g" deploy/index.html

                  # Verify the structure
                  echo "Deploy directory structure:"
                  ls -la deploy/

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "deploy"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: Release ${{ steps.version.outputs.version }}
                  body: |
                      ## 高等数学习题册（上册）${{ steps.version.outputs.version }}

                      自动构建和发布

                      ### 下载
                      - 📖 dtce.pdf (无答案版)
                      - 📖 dtce_ans.pdf (带答案版)

                      ### 在线预览 PDF
                      访问：https://dtce.xihale.top 或 GitHub Pages
                  files: |
                      dtce.pdf
                      dtce_ans.pdf
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}